# ==============================================================================
# AI 国漫短片 / 微电影 · 完整项目配置模板
#
# 用法：
#   1. 复制为 configs/你的项目.yaml
#   2. 按实际情况填写
#   3. python scripts/build_shotlist.py --config configs/你的项目.yaml
#
# 注意：.yaml 需要 pyyaml（pip install pyyaml）。
#       若不想装依赖，用 JSON 格式（见 configs/demo_short.json），
#       build_shotlist.py / compose_video.py 两种格式都支持。
#
# 本文件是「人读模板」，字段与 demo_short.json 完全一致，
# 每个字段都有注释说明该写什么、为什么重要。
# ==============================================================================

project:
  title: "你的片名"
  subtitle: "副标题（可选）"
  # 一句话故事：必须说清冲突，说不清就是还没想好
  logline: "谁 + 想要什么 + 遇到什么阻碍 + 结果如何"
  # short_film 短片（1-5 分钟） | micro_film 微电影（5-20 分钟）
  type: "short_film"
  duration_target_sec: 60          # 目标总时长，脚本会校验实际时长与它的偏差
  aspect_ratio: "16:9"             # 16:9 横屏 | 9:16 竖屏（短视频平台） | 2.39:1 宽银幕
  resolution: "1920x1080"          # 竖屏写 1080x1920
  fps: 24                          # 统一帧率，全片不可混用。24 电影感 / 30 网络顺滑
  language: "zh-CN"

  # 分幕结构。镜头必须全部归入某幕，且顺序要与 shots 一致，否则脚本报错。
  # emotion_curve 是硬性要求：不声明情绪曲线，全片会匀速疲劳。
  act_structure:
    - act: "第一幕·起"
      shots: ["S001", "S002", "S003"]
      emotion_curve: "静→疑"
    - act: "第二幕·承"
      shots: ["S004", "S005", "S006"]
      emotion_curve: "疑→动"
    - act: "第三幕·合"
      shots: ["S007", "S008"]
      emotion_curve: "动→寂"

# ==============================================================================
# 风格圣经：全片共用的视觉基准。没有它，8 个镜头会有 8 种画风。
# ==============================================================================
style_bible:
  # 画风定调。推荐「新国风混合」：远景水墨（便宜、成功率高）+ 近景工笔/赛璐璐（角色稳定）
  art_style: "新国风水墨与赛璐璐混合：墨色晕染的远景 + 干净硬边的角色近景"
  reference_direction: "借鉴风格流派而非具体作品（版权利害相关）"

  # 色彩：4 色原则，超过 4 色画面就散。
  # 覆盖率硬约束 —— 主色 >= 50%，点缀色 <= 15%。点缀色超标是「画面花」的主因。
  palette:
    - { hex: "#1B2A33", name: "墨青",   usage: "主色，山、水、夜" }
    - { hex: "#F5F1E8", name: "宣纸白", usage: "留白、雾、天光" }
    - { hex: "#C9A961", name: "鎏金",   usage: "灯火、高光点缀" }
    - { hex: "#8C2F2F", name: "朱砂",   usage: "情绪强调，覆盖率 < 15%" }

  lighting: "低照度水墨光，主光为月白散射光，逆光勾勒轮廓"
  camera_language: "克制运镜，以缓慢推移与固定机位为主，情绪高点才用急推"
  lens: "35mm 等效为主，特写用 85mm 等效"
  texture: "宣纸纹理叠加，轻微颗粒感，避免过度锐化"
  # 运动强度：低 = 每秒位移 < 画面宽度 8%。AI 视频运镜越大崩得越狠。
  motion_intensity: "低"

  # 负向提示词：只写「不要什么」，但要覆盖风格专属污染源。
  # 水墨风格要加「过度写实皮肤细节」；古风场景要加「现代建筑、电线、车辆」。
  negative_prompt: >-
    真人写实皮肤, 欧美3D渲染, 塑料质感, 多余手指, 五官错位, 文字水印,
    低分辨率, 闪烁, 画面抖动, 变形肢体, 现代服饰, 现代建筑, 车辆, 电线

  consistency_requirements:
    character_anchor_required: true    # 多镜头角色必须有 seed + 参考图，否则脚本报错
    style_prefix_required: true        # 提示词自动拼接风格前缀，保证跨镜统一
    seed_lock_scope: "per_character"   # 种子按角色锁定，不是按镜头

# ==============================================================================
# 角色表：AI 短片最大的坑就是角色不一致。必须靠锚点锁死，不能靠文字描述。
# ==============================================================================
characters:
  - id: "C01"                          # 全片引用标识，不可改
    name: "角色名"
    role: "主角 / 配角 / 旁白"
    age_look: "二十许"
    appearance_anchors:
      # 必须有 2-3 个「不可变特征」—— AI 对特征点的保持能力远高于「整体气质」
      hair: "墨色长发，半束，一支素竹簪"
      face: "清瘦，眼尾微垂，左眉有一道浅疤"     # 疤/痣这类特征是最有效的锚
      clothing: "靛青粗布短褐，外罩灰白蓑衣，腰间挂旧竹牌"
      signature_prop: "一柄磨得发亮的竹篙"
      # forbidden 比正向描述更能防漂移：不写它，第 5 镜就会戴上金冠
      forbidden: "不得出现金饰、华丽纹样、铠甲"
    consistency:
      seed: 480731                     # 角色级固定种子
      reference_image: "03_character/C01_ref.png"
      lora_path: "03_character/loras/xxx_v1.safetensors"   # 可选，主角建议训练
      lora_weight: 0.75                # 0.6-0.85，过高过拟合
      ip_adapter_weight: 0.6           # 0.5-0.7，过高表情僵化
      lock_appearance: true
    voice:
      tts_voice: "zh-CN-YunxiNeural"   # 音色全片不换，换了等于换演员
      rate: "-5%"                      # 放慢比加快更显情绪
      pitch: "-2Hz"                    # 降低显沉稳，升高显年轻
      persona: "清冷、话少、尾音下沉"    # 给 Agent 的配音风格提示

  # 微电影需要为角色定义「状态节点」，否则 AI 会在换装时随机发挥：
  # state_timeline:
  #   - { shots: ["S001","S012"], state: "默认造型" }
  #   - { shots: ["S013","S018"], state: "湿身（衣料贴身、发丝滴水）" }
  #   - { shots: ["S019"], state: "无蓑衣（遗落在渡口）" }

# ==============================================================================
# 镜头表：1 镜 = 1 个视觉信息单元
# ==============================================================================
shots:
  - id: "S001"                         # 三位数编号，顺序即剪辑顺序
    act: "第一幕·起"
    scene: "场景名与时间"
    duration_sec: 7.0                  # AI 视频单镜不超过 10 秒！超过必然结构漂移
    shot_size: "大远景"                # 大远景/远景/全景/中景/近景/特写/大特写
    camera_move: "极缓横移"            # 固定最安全；急推/甩镜 AI 视频极易崩
    # description 给导演看，写清画面内容与人物关系
    description: "水墨远山连绵，江面平如宣纸，一叶渡船静泊，船头立着撑篙的人影。"
    characters: []                     # 引用角色 id，空数组表示无角色
    # image_prompt 给模型看：具体、可视化、有物理约束。不要写「好看的男子」。
    image_prompt: "新国风水墨画，大远景，黄昏江渡，连绵远山以淡墨晕染，江面留白占画面六成，一叶乌篷小船停泊在画面右下三分之一处，宣纸纹理"
    # video_prompt 只写运动！不要重复画面内容。必须写「保持项」来防崩。
    video_prompt: "镜头极缓向右横移，江面微波轻漾，雾气缓慢飘动，人物衣角轻微摆动，全程无镜头抖动，光线保持稳定"
    dialogue:
      - character: "C01"
        text: "台词内容。中文 TTS 约 4.8 字/秒，脚本会自动校验是否超出镜头时长。"
        start_sec: 2.0                 # 相对本镜起点的秒数，不是全片时间
        emotion: "平静但倔强"           # 给配音的情绪提示
    sfx: ["远江水流声", "竹篙入水声"]
    bgm: "古琴单音淡入，音量 -22dB"
    transition_out: "cut"              # cut 硬切（建议 80%+）/ dissolve / fade / fade_to_black / flash_cut
    # 片名卡、字幕等后期叠加（可选）
    # post_overlay:
    #   type: "title_card"
    #   text: "片名"
    #   subtext: "副标题"
    #   font: "assets/fonts/xxx.otf"
    #   start_sec: 7.0
    #   duration_sec: 2.0

# ==============================================================================
# 音频
# ==============================================================================
audio:
  voiceover:
    engine: "edge-tts"                 # 免费，无需 API Key
    output_dir: "05_audio/voice"
    format: "mp3"
    sample_rate: 24000
    loudness_target_lufs: -16          # 配音轨响度
    note: "配音生成后必须人工试听：多音字、断句、语气"
  bgm:
    file: "05_audio/bgm/xxx.mp3"
    license: "必须为已授权曲库或自有版权，禁止使用商业歌曲"
    base_volume_db: -22                # 无人声时的音乐音量
    ducking_db: -8                     # 有人声时自动降低的幅度
    ducking_on_dialogue: true          # 侧链闪避开关
    fade_in_sec: 2.0
    fade_out_sec: 3.0
  sfx_dir: "05_audio/sfx"
  master:
    loudness_target_lufs: -14          # 成片母版：抖音/B站/视频号都用 -14
    true_peak_db: -1.0                 # 真实峰值上限，防转码削波
    note: "影院展映用 -20 ~ -24 LUFS"

# ==============================================================================
# 字幕
# ==============================================================================
subtitle:
  enabled: true
  style:
    # font_name 在目标机器上不存在时，脚本会按 font_candidates 自动回退。
    # 这一步很重要：找不到字体会静默回退，字幕变成方框而 ffmpeg 不报错。
    font_name: "Noto Sans CJK SC"
    font_candidates:
      - "Noto Sans CJK SC"             # Linux / CI
      - "Source Han Sans SC"           # 思源黑体
      - "Microsoft YaHei"              # Windows
      - "SimHei"
      - "PingFang SC"                  # macOS
      - "WenQuanYi Zen Hei"
    font_size: 26
    primary_color: "FFFFFF"
    outline_color: "1B2A33"            # 描边色建议用画面主色，防糊在浅色画面上
    outline_width: 2
    shadow: 1
    margin_v: 48                       # 底部留白；短视频平台建议 60+
    alignment: 2                       # ASS 规范：2 = 底部居中
  max_chars_per_line: 16               # 中文单行上限，超过会压到画面主体
  max_lines: 2
  min_duration_sec: 1.0                # 单条最短显示时间，更短观众看不清
  note: "字幕须与配音波形对齐；估算时长用于预览，成片前建议用 faster-whisper 校验"

# ==============================================================================
# 导出
# ==============================================================================
output:
  dir: "06_final"
  filename: "your_project_v1.mp4"
  codec: "libx264"
  crf: 18                              # 18 视觉无损；> 23 画质明显下降
  preset: "slow"                       # 耗时换体积
  pix_fmt: "yuv420p"                   # 必须！否则部分播放器黑屏
  audio_codec: "aac"
  audio_bitrate: "192k"
  movflags: "+faststart"               # 网络播放秒开

# ==============================================================================
# 合规自查（影视创作尤其重要，务必逐项确认）
# ==============================================================================
compliance:
  checklist:
    - "所有生成素材的平台条款已核对（商用权限）"
    - "无真人明星肖像、无未授权 IP 角色形象"
    - "BGM 为已授权曲库或自有版权"
    - "配音为平台音色或已获授权的声音克隆"
    - "涉及中国地图的画面使用合规地图数据，中国香港/中国台湾/中国澳门标注符合国家标准"
    - "涉及历史、民族、宗教内容的表述已人工核查"
    - "台词无错别字、无事实性错误（已逐句校对）"
    - "如需报送或上线发行，已按现行规定办理备案与内容审核"
